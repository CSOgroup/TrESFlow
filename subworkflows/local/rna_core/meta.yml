name: "rna_core"
description: "Runs the TrES RNA branch from barcode tagging through split outputs, FqToSAM, STARsolo, filtered BAM generation, and coverage."
authors:
  - "Ahrmad Annan"
  - "Nikita Miroshnichenko"
keywords:
  - "rna"
  - "starsolo"
  - "tres"
components:
  - "tag/rna/sample/barcode"
  - "tag/rna/umi"
  - "tag/rna/cell/barcode"
  - "trim/rna/fastqs"
  - "split/rna/reads"
  - "compress/split/fastqs"
  - "fq/to/sam"
  - "rna/starsolo/align"
  - "rna/filtered/bam"
  - "compress/rna/filtered/bam"
  - "rna/coverage"
input:
  - ch_rna_samples:
      type: tuple
      description: "RNA modality rows parsed from the hierarchical YAML samplesheet plus derived helper files."
output:
  - tagged_fastqs:
      type: file
      description: "Final RNA tagged FASTQs from the cell-barcode stage."
  - trimmed_fastqs:
      type: file
      description: "Trimmed RNA FASTQs."
  - split_fastqs:
      type: file
      description: "Gzip-compressed publication copies of per-group split RNA FASTQs."
  - rg_headers:
      type: file
      description: "SAM RG header TSVs for split RNA outputs."
  - usam_files:
      type: file
      description: "Grouped RNA unmapped SAM files."
  - sample_barcode_counts:
      type: file
      description: "RNA sample-barcode count TSVs."
  - cell_barcode_counts:
      type: file
      description: "RNA cell-barcode count TSVs."
  - aligned_solo_dirs:
      type: directory
      description: "RNA STARsolo output directories."
  - aligned_filtered_bams:
      type: file
      description: "Normally compressed publication copies of RNA filtered BAM files."
  - internal_filtered_bams:
      type: file
      description: "Low-compression RNA filtered BAMs used internally by coverage and QC."
  - aligned_stranded_bigwigs:
      type: file
      description: "RNA stranded bigWig tracks."
  - aligned_unstranded_bigwigs:
      type: file
      description: "RNA unstranded bigWig tracks."
  - barcode_reports:
      type: file
      description: "Collected RNA barcode metric outputs from upstream tagging steps."
  - tres_tag_records:
      type: file
      description: "Final gzip-compressed RNA tag-record TSV."
  - versions:
      type: file
      description: "Aggregated module version manifests emitted by the RNA core."
